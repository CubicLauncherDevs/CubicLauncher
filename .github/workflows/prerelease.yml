name: Build Prerelease Draft

on:
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    VERSION_TAG: v${{ inputs.version }}

jobs:
    prerelease:
        if: github.ref == 'refs/heads/develop'
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "macos-latest"
                      args: "--target aarch64-apple-darwin"
                      short_target: "aarch64"
                      bundle_path: "src-tauri/target/aarch64-apple-darwin/release/bundle/"
                    - platform: "macos-latest"
                      args: "--target x86_64-apple-darwin"
                      short_target: "x86_64"
                      bundle_path: "src-tauri/target/x86_64-apple-darwin/release/bundle/"
                    - platform: "ubuntu-22.04"
                      args: ""
                      short_target: "x86_64"
                      bundle_path: "src-tauri/target/release/bundle/"
                    - platform: "windows-latest"
                      args: ""
                      short_target: "x86_64"
                      bundle_path: "src-tauri/target/release/bundle/"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4
            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest
            - name: Install dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: ". -> target"
            - name: Install frontend dependencies
              run: bun install
            - name: Build y publicar prerelease
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: v${{ github.run_number }}-dev
                  releaseName: "CubicLauncher DEV Build #${{ github.run_number }}"
                  releaseBody: |
                      ⚠️ **Esta es una versión de desarrollo**
                      Build automático desde la rama develop.
                      ## Cambios en esta versión
                      Ver los commits para más detalles.
                  releaseDraft: false
                  prerelease: true
                  includeUpdaterJson: false
                  args: ${{ matrix.args }}