name: Build Prerelease Draft

on:
    workflow_dispatch:
        inputs:
            cache_only:
                description: "Preparar la caché Rust de release sin publicar un borrador"
                type: boolean
                default: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    prerelease:
        if: github.ref == 'refs/heads/develop'
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "macos-latest"
                      rust_target: "aarch64-apple-darwin"
                      args: "--target aarch64-apple-darwin"
                      short_target: "aarch64"
                      bundle_path: "src-tauri/target/aarch64-apple-darwin/release/bundle/"
                    - platform: "macos-latest"
                      rust_target: "x86_64-apple-darwin"
                      args: "--target x86_64-apple-darwin"
                      short_target: "x86_64"
                      bundle_path: "src-tauri/target/x86_64-apple-darwin/release/bundle/"
                    - platform: "ubuntu-22.04"
                      rust_target: "x86_64-unknown-linux-gnu"
                      args: ""
                      short_target: "x86_64"
                      bundle_path: "src-tauri/target/release/bundle/"
                    - platform: "windows-latest"
                      rust_target: "x86_64-pc-windows-msvc"
                      args: "-b nsis"
                      short_target: "x86_64"
                      bundle_path: "src-tauri/target/release/bundle/"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4
            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest
            - name: Install dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust_target }}
            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: ". -> target"
                  # Must match release.yml. develop is the default branch: its caches
                  # can be restored by tag builds; caches saved under other tags cannot.
                  shared-key: tauri-release-${{ matrix.platform }}-${{ matrix.rust_target }}
                  cache-on-failure: "true"
                  save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            - name: Install frontend dependencies
              run: bun install
            - name: Warm release cache without publishing
              if: inputs.cache_only
              run: bun run tauri build --no-bundle ${{ matrix.platform == 'macos-latest' && format('--target {0}', matrix.rust_target) || '' }} -- --locked
            - name: Build y publicar prerelease
              if: ${{ !inputs.cache_only }}
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: v${{ github.run_number }}-dev
                  releaseName: "CubicLauncher DEV Build #${{ github.run_number }}"
                  releaseBody: |
                      ⚠️ **Esta es una versión de desarrollo**
                      Build automático desde la rama develop.
                      ## Cambios en esta versión
                      Ver los commits para más detalles.
                  releaseDraft: true
                  prerelease: true
                  includeUpdaterJson: false
                  args: ${{ matrix.args }} -- --locked
