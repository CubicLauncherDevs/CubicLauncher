name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    nix:
        name: Nix Build (${{ matrix.system }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                # Keep in sync with supportedSystems in flake.nix.
                include:
                    - system: x86_64-linux
                      runner: ubuntu-24.04
                    - system: aarch64-linux
                      runner: ubuntu-24.04-arm
                    - system: aarch64-darwin
                      runner: macos-15
        timeout-minutes: 90
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes

            - name: Check Nix package
              run: nix flake check --system "${{ matrix.system }}" --print-build-logs

    frontend:
        name: Frontend Checks
        runs-on: ubuntu-latest
        env:
            NODE_OPTIONS: --max-old-space-size=6144
        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Lint
              run: bun run lint

            - name: Type check
              run: bun run check

            - name: Tests
              env:
                  CHROME_BIN: /usr/bin/google-chrome
              run: |
                  "$CHROME_BIN" --version
                  dbus-run-session -- bun run test:frontend

            - name: Build
              run: bun run build

    rust:
        name: Rust Checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: ". -> target"
                  # Keep the existing CI namespace; dev/test artifacts differ from release.
                  shared-key: rust
                  save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

            - name: Format check
              run: cargo fmt --check

            - name: Clippy
              run: cargo clippy --workspace --locked -- -D warnings

            - name: Tests
              run: cargo test --workspace --locked --verbose
