[package]
name = "aqua"
version = "0.1.0"
edition = "2024"
description = "Minecraft assets, Java runtime and loader download library for CubicLauncher"
authors = ["Santiagolxx", "CubicLauncher contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/CubicLauncherDevs/CubicLauncher"

[features]
extract-natives = []
default = ["extract-natives"]

[dependencies]
futures = "0.3"
log = "0.4"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zellkern = { path = "../zellkern" }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
zip = "8"
tar = "0.4"
flate2 = "1.0"
tempfile = "3"
