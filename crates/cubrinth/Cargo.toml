[package]
name = "cubrinth"
version = "0.1.0"
edition = "2024"
description = "Modpack (.mrpack) handling library for CubicLauncher"
authors = ["Santiagolxx", "CubicLauncher contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/CubicLauncherDevs/CubicLauncher"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zellkern = { path = "../zellkern" }
zip = "9.0.5"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
aqua = { path = "../aqua" }
