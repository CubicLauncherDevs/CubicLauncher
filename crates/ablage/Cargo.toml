[package]
name = "ablage"
version = "0.1.0"
edition = "2024"
description = "Content-addressable storage library for CubicLauncher"
authors = ["Santiagolxx", "CubicLauncher contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/CubicLauncherDevs/CubicLauncher"

[dependencies]
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
crc32fast = "1"
