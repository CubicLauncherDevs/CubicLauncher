[package]
name = "communicator"
version = "0.1.0"
edition = "2024"
description = "Discord RPC client library for CubicLauncher"
authors = ["Santiagolxx", "CubicLauncher contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/CubicLauncherDevs/CubicLauncher"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1.41"

[dev-dependencies]
tracing-subscriber = "0.3.19"
