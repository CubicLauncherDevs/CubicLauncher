    <use href="#bat" transform="translate(455, 118) scale(0.8)"/>
    <use href="#bat" transform="translate(760, 235) scale(1.05)"/>
    <use href="#bat" transform="translate(1155, 330) scale(0.7)"/>
    <use href="#bat" transform="translate(620, 300) scale(0.6)"/>
  </g>

  <path d="M0 520 Q 220 430 450 495 T 900 495 T 1280 455 L1280 720 L0 720 Z" fill="url(#hillFar)"/>
  <path d="M0 600 Q 300 520 620 580 T 1280 560 L1280 720 L0 720 Z" fill="url(#hillNear)"/>

  <g>
