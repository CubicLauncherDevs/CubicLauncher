    <circle cx="720" cy="190" r="1.7" opacity="0.5"/>
    <circle cx="860" cy="90" r="2.1" opacity="0.7"/>
    <circle cx="1150" cy="70" r="1.8" opacity="0.65"/>
    <circle cx="1230" cy="200" r="2" opacity="0.5"/>
    <circle cx="80" cy="260" r="1.6" opacity="0.45"/>
    <circle cx="470" cy="230" r="1.5" opacity="0.5"/>
