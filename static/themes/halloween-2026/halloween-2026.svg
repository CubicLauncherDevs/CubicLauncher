      <path d="M-26 -52 Q-36 0 -26 52" fill="none" stroke="#9c4705" stroke-width="3" opacity="0.45"/>
      <path d="M26 -52 Q36 0 26 52" fill="none" stroke="#9c4705" stroke-width="3" opacity="0.45"/>
      <path d="M0 -54 L0 54" fill="none" stroke="#9c4705" stroke-width="2.5" opacity="0.3"/>
      <ellipse cx="0" cy="2" rx="72" ry="56" fill="none" stroke="#8f4205" stroke-width="3" opacity="0.5"/>
      <path d="M-9 -58 q7 -24 21 -20 q-7 9 -5 22 Z" fill="#4f7a2e"/>
      <path d="M-11 -58 q10 -6 22 -2" fill="none" stroke="#3c6023" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="0" cy="6" rx="54" ry="42" fill="url(#faceGlow)"/>
      <path d="M-34 -16 L-14 -16 L-24 6 Z" fill="#ffe08a"/>
