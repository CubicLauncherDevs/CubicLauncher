<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Noche de Halloween con luna, murciélagos y calabazas iluminadas">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150b22"/>
      <stop offset="0.45" stop-color="#1d1028"/>
      <stop offset="1" stop-color="#0a0610"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ffcf7a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d36"/>
      <stop offset="1" stop-color="#150d1f"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180f22"/>
